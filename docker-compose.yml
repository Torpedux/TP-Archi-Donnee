# PostgreSQL + Neo4j + seed (données, import du graphe) + app (Bracket).
# Provisoire (Matteo), à relire par Armand.
#
#   docker compose up -d --build        tout, puis http://localhost:3000
#   docker compose run --rm seed        resynchronise Neo4j depuis PostgreSQL
#   docker compose down -v              repart de zéro
#
# Neo4j Browser : http://localhost:7474 (neo4j / motdepasse). Valeurs modifiables dans .env (voir .env.example).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-esport}
    ports:
      - "${PORT_POSTGRES:-5432}:5432"
    volumes:
      - donnees_pg:/var/lib/postgresql/data
      # Joué une seule fois, à la création du volume.
      - ./modele/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      # psql -f /modele/postgres/requetes.sql
      - ./modele/postgres:/modele/postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-esport}"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-motdepasse}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "${PORT_NEO4J_WEB:-7474}:7474"
      - "${PORT_NEO4J:-7687}:7687"
    volumes:
      - donnees_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-motdepasse} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Charge les données au premier lancement, puis reconstruit le graphe Neo4j à chaque fois.
  seed:
    build:
      context: .
      dockerfile: modele/seed/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    working_dir: /work
    volumes:
      - .:/work
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PG_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-esport}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-motdepasse}
    command:
      - sh
      - -ec
      - |
        # Premier lancement seulement : les données saisies dans l'app survivent aux redémarrages.
        if [ "$$(psql "$$PG_DSN" -tAc 'SELECT count(*) FROM jeu')" = "0" ]; then
          python modele/donnees/generer.py
          psql "$$PG_DSN" -v ON_ERROR_STOP=1 -f modele/postgres/charger.sql
        fi
        python modele/neo4j/importer.py --source pg --reset

  # L'application Bracket : http://localhost:3000
  app:
    build: ./app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "${PORT_APP:-3000}:3000"
    environment:
      PG_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-esport}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-motdepasse}
      TZ: Europe/Paris
      # Secret de signature des sessions : à changer hors démo (.env).
      AUTH_SECRET: ${AUTH_SECRET:-bracket-demo-secret-a-changer-0123456789}
      AUTH_TRUST_HOST: "true"
      # L'adresse que le navigateur utilise (redirections après connexion).
      AUTH_URL: ${AUTH_URL:-http://localhost:${PORT_APP:-3000}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bracket.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-bracket}

volumes:
  donnees_pg:
  donnees_neo4j:
